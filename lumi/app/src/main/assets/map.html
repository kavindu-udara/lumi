<!doctype html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIINfQ3Z3cVv1hWvWv5K5M8t2dX6Q5k5xM="
          crossorigin="">
    <style>
        html, body, #map { height: 100%; margin: 0; }
        .photo-marker {
            background: #6750a4;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 1px 5px rgba(0,0,0,.35);
            width: 16px !important;
            height: 16px !important;
        }
    </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<script>
    const map = L.map('map', { zoomControl: true }).setView([7.8731, 80.7718], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    const markerLayer = L.layerGroup().addTo(map);

    window.renderPhotoMarkers = function (locations) {
        markerLayer.clearLayers();
        locations.forEach(function (location, index) {
            const marker = L.marker([location.latitude, location.longitude], {
                icon: L.divIcon({ className: 'photo-marker', iconSize: [22, 22], iconAnchor: [11, 11] })
            });
            marker.bindTooltip('Photo location', { direction: 'top', offset: [0, -10] });
            marker.on('click', function () {
                if (window.LumiAndroid) {
                    window.LumiAndroid.onPhotoMarkerClicked(index);
                }
            });
            markerLayer.addLayer(marker);
        });
    };
</script>
</body>
</html>
