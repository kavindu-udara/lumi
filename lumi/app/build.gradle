plugins {
    alias(libs.plugins.android.application)
}

def dotenv = [:]
def dotenvFile = rootProject.file(".env")
if (dotenvFile.isFile()) {
    dotenvFile.eachLine { line ->
        def match = line =~ /^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*["']?(.*?)["']?\s*$/
        if (match.matches()) {
            dotenv[match.group(1)] = match.group(2)
        }
    }
}

def configValue = { String name ->
    project.findProperty(name) ?: System.getenv(name) ?: dotenv[name] ?: ""
}

android {
    namespace 'com.example.lumi'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.lumi"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "SUPABASE_URL",
                "\"${configValue("SUPABASE_URL")}\""
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY",
                "\"${configValue("SUPABASE_PUBLISHABLE_KEY")}\""
        buildConfigField "String", "API_BASE_URL",
                "\"${configValue("API_BASE_URL")}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig true
    }
}

